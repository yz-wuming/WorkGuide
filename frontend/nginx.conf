# WorkGuide 前端生产静态服务器 —— Vite SPA
# 由 frontend/Dockerfile 的 prod 阶段复制到 /etc/nginx/conf.d/default.conf。
#
# 本容器只托管构建产物 dist/，监听 3000，不代理任何 API：
# /api/* 由外层 nginx(docker/nginx) 统一转发到 gateway:8001，
# 因此这里不需要 upstream，也绝对不要配置 proxy_pass 到某台后端。
#
# SPA history 回退：一切未命中静态文件的前端路由都返回 index.html，
# 避免深链刷新/直达时出现 404（Vite SPA 没有服务端路由）。

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 静态文件命中即直接返回（带较长缓存）；未命中的路径回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 指纹化静态资源加 immutable 缓存；Vite 产物名默认含 content hash。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}