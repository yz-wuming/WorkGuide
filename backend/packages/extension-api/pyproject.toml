[project]
name = "workguide-extension-api"
version = "0.2.0"
description = "Public contracts for WorkGuide extensions"
requires-python = ">=3.12"
# Keep the contract package import-light and independent from the host. Public
# values are stdlib-based; concrete middleware types are validated by WorkGuide.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workguide_extension_api"]
