# WorkGuide Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Vite SPA production static server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - redis:       Redis Streams backend for cross-worker SSE stream bridge
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# 使用方式（见 README「Docker 一键运行」）：
#   docker compose -f docker/docker-compose.yaml up --build
# make up（经由 scripts/deploy.sh）与此等价，且会帮你探测/配置各项
# WORKGUIDE_* 路径并生成默认 secret。直接 docker compose 时，下面这些
# 托管到宿主机的路径变量都带有仓库相对路径默认值，无需手工设置。
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   WORKGUIDE_PROJECT_ROOT           — project root for relative runtime paths
#   WORKGUIDE_HOME                   — runtime data dir, default .workguide under $WORKGUIDE_PROJECT_ROOT (or cwd)
#   WORKGUIDE_CONFIG_PATH            — path to config.yaml
#   WORKGUIDE_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   WORKGUIDE_SKILLS_PATH            — skills dir, default $WORKGUIDE_PROJECT_ROOT/skills
#   WORKGUIDE_DOCKER_SOCKET          — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   WORKGUIDE_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   WORKGUIDE_INTERNAL_AUTH_TOKEN    — shared internal Gateway auth token for multi-worker IM channels
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Redis Stream Bridge ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: workguide-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - workguide
    restart: unless-stopped

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: workguide-nginx
    # Loopback-only by default: WorkGuide's agent can execute commands, so the
    # documented default deployment is a local trusted environment. A bare
    # "${PORT}:2026" would bind 0.0.0.0 instead, which does not match that.
    # Set BIND_HOST=0.0.0.0 only behind your own TLS/auth front door, and
    # complete first-run setup before the host becomes reachable.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_healthy
    networks:
      - workguide
    restart: unless-stopped

  # ── Frontend: Vite SPA static server ───────────────────────────────────────
  # 纯静态托管 frontend/dist，listen 3000，/api/* 由外层 nginx 转发到 gateway。
  # 前端源码不引用任何 VITE_* 变量，因此不需要任何运行时环境变量；
  # 下面的 env_file 仅做向后兼容，缺文件也不会阻断启动（required: false）。
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-}
        APK_MIRROR: ${APK_MIRROR:-}
    container_name: workguide-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - WORKGUIDE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - path: ../frontend/.env
        required: false
    networks:
      - workguide
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NODEJS_MIRROR: ${NODEJS_MIRROR:-https://nodejs.org/dist}
        LARK_CLI_NPM_VERSION: ${LARK_CLI_NPM_VERSION:-1.0.65}
    container_name: workguide-gateway
    # Gateway hosts the agent runtime with in-process RunManager + StreamBridge
    # singletons -- run state lives in this worker's memory. Default to a single
    # worker: the Redis stream bridge solves cross-worker SSE delivery and
    # reconnect, but run cancel, request dedup, and per-worker IM channel
    # services remain worker-local. Override GATEWAY_WORKERS only when the
    # Redis stream bridge is enabled and those limitations are acceptable.
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      # Host-path 默认值均为仓库相对路径（相对 docker/ 目录），使
      # `docker compose -f docker/docker-compose.yaml up` 无需 make/手工配置
      # 即可启动。scripts/deploy.sh(make up) 传入的绝对路径仍优先。
      - ${WORKGUIDE_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      # Writable on purpose: the Gateway edits this file at runtime (MCP
      # enable/disable, PUT/PATCH /api/mcp/config, skill updates). config.yaml
      # above stays read-only because no API writes it.
      - ${WORKGUIDE_EXTENSIONS_CONFIG_PATH:-../extensions_config.json}:/app/backend/extensions_config.json
      # Skills 拆分读写：Built-in(public) 保持只读保护；Custom(custom) 可写，
      # 以便 Create/Enable/Disable/Delete Skill 落地到宿主机 skills/custom/，
      # 容器重启后依然存在。对应源码：
      #  LocalSkillStorage 根 = get_skills_path() = /app/skills，
      #  custom 写入 <root>/custom/<name>/SKILL.md 与 <root>/custom/.history/。
      - ../skills/public:/app/skills/public:ro
      - ../skills/custom:/app/skills/custom:rw
      - ${WORKGUIDE_HOME:-../backend/.workguide}:/app/backend/.workguide
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/deploy.sh). See backend/docs/CONFIGURATION.md
      # Security Note section for details.
       
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    environment:
      - CI=true
      - WORKGUIDE_PROJECT_ROOT=/app
      - WORKGUIDE_HOME=/app/backend/.workguide
      - WORKGUIDE_CONFIG_PATH=/app/backend/config.yaml
      - WORKGUIDE_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - WORKGUIDE_STREAM_BRIDGE_REDIS_URL=${WORKGUIDE_STREAM_BRIDGE_REDIS_URL:-redis://redis:6379/0}
      - WORKGUIDE_CHANNELS_LANGGRAPH_URL=${WORKGUIDE_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - WORKGUIDE_CHANNELS_GATEWAY_URL=${WORKGUIDE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - WORKGUIDE_INTERNAL_AUTH_TOKEN=${WORKGUIDE_INTERNAL_AUTH_TOKEN}
      # DooD path/network translation
      - WORKGUIDE_HOST_BASE_DIR=${WORKGUIDE_HOME}
      - WORKGUIDE_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,openviking,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,openviking,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - workguide
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  # Gated behind the `provisioner` profile: it is only relevant to the
  # Kubernetes / provisioner sandbox mode and is NOT started by a plain
  # `docker compose up`. Enable it explicitly with:
  #   docker compose -f docker/docker-compose.yaml --profile provisioner up --build
  provisioner:
    profiles: ["provisioner"]
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: workguide-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=workguide
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # Optional lark-cli init image (Pattern A). Empty ⇒ legacy runtime mount.
      # Set to a published tag (e.g. workguide/lark-cli-init:v1.0.65) to provision
      # the sandbox lark-cli runtime via an init container + emptyDir.
      - LARK_CLI_INIT_IMAGE=${LARK_CLI_INIT_IMAGE:-}
      # Optional lark-cli broker image (Pattern B, issue #4338). When set, the
      # sandbox gets a shim + broker sidecar that holds the credentials, so the
      # plaintext config/data are never mounted into the sandbox. Supersedes
      # LARK_CLI_INIT_IMAGE when both are set. Empty ⇒ broker off.
      - LARK_CLI_BROKER_IMAGE=${LARK_CLI_BROKER_IMAGE:-}
      - THREADS_HOST_PATH=${WORKGUIDE_HOME}/threads
      - WORKGUIDE_HOST_BASE_DIR=${WORKGUIDE_HOME}
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workguide
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  redis-data:

networks:
  workguide:
    driver: bridge
